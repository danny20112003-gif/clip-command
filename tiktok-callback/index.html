<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connecting…</title>
<style>body{font-family:system-ui,sans-serif;max-width:560px;margin:60px auto;padding:0 16px;text-align:center}</style></head><body>
<p id="m">Connecting your TikTok account…</p>
<script>
// Forwards the TikTok OAuth result (code/state or error) to the dashboard running on this computer.
var target = "http://localhost:8787/oauth/tiktok/callback" + window.location.search;
document.getElementById("m").innerHTML = 'Connecting… If nothing happens, <a href="' + target + '">click here</a> (the dashboard must be running on this computer).';
window.location.replace(target);
</script></body></html>
